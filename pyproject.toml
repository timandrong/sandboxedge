[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timandrong-sandboxedge"
version = "0.1.0"
description = "比对实际操作与沙箱策略，标出越界访问与被放行的越界尝试"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "timandrong" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://timandrong.github.io"
Repository = "https://github.com/timandrong/sandboxedge"
Issues = "https://github.com/timandrong/sandboxedge/issues"

[project.scripts]
sandboxedge = "sandboxedge:main"

[tool.setuptools]
py-modules = ["sandboxedge"]
